[routers]
target

[routers:vars]
# router ปลายทางมาจากตัวแปร router ที่ส่งด้วย --extra-vars
ansible_host={{ router }}
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_network_cli_ssh_type=paramiko
# username/password อ่านจาก environment (ห้ามใส่ลงไฟล์)
ansible_user={{ lookup('env', 'ROUTER_USER') }}
ansible_password={{ lookup('env', 'ROUTER_PASS') }}
